name: RoundsPlugin
version: '${version}'
main: com.rounds.RoundsPlugin
api-version: '1.20'
description: Rounds minigame plugin
authors: [Ifrit]
softdepend: [PlaceholderAPI, TAB]
commands:
  rdebug:
    description: Debug tools for testing
    usage: /rdebug <subcommand>
  rbot:
    description: Manage bots
    usage: /rbot <subcommand>
permissions:
  rounds.admin:
    description: Admin permission for rounds commands
    default: op
  admin.rounds:
    description: Admin permission for rounds commands
    default: op
  rounds.join:
    description: Permission to join teams
    default: true
