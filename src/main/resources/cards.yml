# Rounds Plugin - Card Configuration (67 cards from original ROUNDS by Landfall)
# Each card has:
#   name: Display name (supports color codes with &)
#   description: Short description shown in GUI
#   material: Bukkit Material name
#   rarity: COMMON, UNCOMMON, RARE, EPIC, LEGENDARY
#   enabled: true/false
#   effects: stat modifiers
#   commands: list of commands to run on player when card is applied
#
# Available effect keys:
#   damage, attack-speed, attack-range, bullets, ammo, bullet-speed,
#   bounce, hp, cold, cold-level, poison, poison-level, homing, leech,
#   empower, empower-charge, dark-strength, barage, big-bullet,
#   bomb-bullet, explode-bullets, target-bounce, shield, truster,
#   grow, attack-speed-reload, parazit, parazit-level
