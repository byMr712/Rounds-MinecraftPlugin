# ==============================================================================
# Rounds Plugin Configuration
# ==============================================================================

# Language configuration:
# File name from plugins/Rounds/lang/ without the .txt extension (e.g. EN_en, RU_ru).
# Legacy short codes ("ru", "en") are also accepted.
language: EN_en

# ==============================================================================
# DEFAULT PLAYER STATS
# ==============================================================================
# Base statistics assigned to each player at the start of a round before cards apply.
defaults:
  # Base bullet damage
  damage: 3.0
  # Base attack cooldown in ticks (20 ticks = 1 second). Lower = faster shooting
  attack-speed: 20
  # Additional attack speed modifier (modified by cards, default 0)
  attack-speed-modifier: 0
  # Extra projectile range in blocks
  attack-range: 0
  # Starting ammunition in the current magazine
  ammo: 3
  # Maximum magazine capacity (reloading fills up to this value)
  max-ammo: 3
  # Projectiles fired per shot (1 = single projectile, >1 = spread/shotgun)
  bullets: 1
  # Starting player health points (20 = 10 hearts)
  hp: 20
  # Projectile flight velocity multiplier (1.0 = standard speed)
  bullet-speed: 1.0
  # Reload speed modifier (0.0 = base ~3.0s, 0.95 = near instant)
  reload-speed: 0

# ==============================================================================
# MATCH & ROUND MECHANICS
# ==============================================================================
game:
  # Default number of rounds required to win the match
  default-rounds: 5
  # Upper limit for the rounds setting
  max-rounds: 20
  # Countdown before a round officially starts in seconds
  countdown-seconds: 3
  # Time in seconds for players to choose an upgrade card (minimum 10 seconds)
  card-choice-time: 30
  # Inventory GUI display duration in ticks (200 ticks = 10 seconds)
  card-selection-time: 200
  # Delay in ticks before respawning players into the arena
  respawn-delay: 5
  # Sudden death timer to prevent infinite stall rounds
  auto-death:
    # Whether auto-death kicks in if a round runs too long
    enabled: true
    # Delay in seconds after round start before the first death event
    delay-seconds: 240
    # Interval in seconds between subsequent warning / death events
    interval-seconds: 60

# ==============================================================================
# TEAM SETUP
# ==============================================================================
# Participating team colors enabled in matchmaking and arena spawns.
teams:
  enabled:
    - BLUE
    - RED
    - YELLOW
    - GREEN

# ==============================================================================
# WEAPON & SHIELD SETTINGS
# ==============================================================================
gun:
  # Item material representing the primary weapon
  material: CROSSBOW
  # Base attack cooldown in ticks
  base-cooldown: 20

shield:
  # Base shield duration in ticks (20 ticks = 1.0 second)
  duration-ticks: 20
  # Base shield cooldown in milliseconds (10000 = 10 seconds)
  cooldown-ms: 10000
  # Cooldown for the "No Party" card pulse in milliseconds (30000 = 30 seconds)
  no-party-cooldown-ms: 30000
  # Radius in blocks for the "No Party" pulse effect
  no-party-radius: 5.0

# ==============================================================================
# CARD SYSTEM
# ==============================================================================
cards:
  # Number of random upgrade cards offered to the player in the draft GUI
  selection-count: 5
  # Whether card drop chances scale with rarity (Common, Uncommon, Rare, Legendary)
  weighted-rarity: true

# ==============================================================================
# FAKE PLAYER BOTS (AI)
# ==============================================================================
bots:
  # Maximum bots allowed to spawn in a single bulk command
  bulk-limit: 500
  # Vision parameters (anti-wallhack mechanics)
  vision:
    # Field of view cone in degrees (140.0 = 70.0 degrees left and right)
    fov-degrees: 140.0
    # Maximum visual raycast detection distance in blocks
    max-distance: 60.0
    # Footstep hearing radius in blocks (allows awareness behind back if unblocked)
    proximity-hearing: 2.5
  # Jump pad parrying mechanics (fair shield block 10-20 ticks ahead)
  jump-pad-parry:
    # Chance for eligible bots to parry jump pads with shield
    chance: 0.50
    # Minimum bot difficulty level (1-10) required to anticipate and parry jump pads
    min-level: 5

# ==============================================================================
# ARENA INTERACTIVE BLOCKS
# ==============================================================================
# Jump Pad Block: Launches players upwards. Deals percentage damage unless parried.
jump-block:
  # Percentage of maximum HP taken upon landing (20.0 = 20% max HP)
  damage-percent: 20.0
  # Vertical launch height in blocks
  launch-height: 10.0

# Up Block: Creates an anti-gravity elevator beam.
up-block:
  # Upward velocity vector applied per tick
  lift-speed: 0.3
  # Duration in ticks of the upward levitation effect
  duration-ticks: 40

# ==============================================================================
# WORLD GAME RULES
# ==============================================================================
# Automatically enforced world game rules during active matches.
game-rules:
  # Master toggle for automatic world game rules overrides
  enabled: true
  # Instant respawn without death screen
  instant-respawn: true
  # Preserve player inventory on death
  keep-inventory: true
  # Lock daylight cycle to permanent daytime
  freeze-time: true
  # Disable rain, thunder, and storms
  disable-weather: true
  # Prevent vanilla mob spawning
  disable-mob-spawning: true

# ==============================================================================
# DISPLAY & SCOREBOARD
# ==============================================================================
# Color player names in the tab list and above heads matching team color
color-nicknames: true

# Built-in scoreboard:
# Note: Recommended option is using TAB + PlaceholderAPI.
# If using TAB plugin, leave this disabled to prevent scoreboard flicker.
builtin-scoreboard:
  enabled: false
  title: "&6&lROUNDS"

# ==============================================================================
# FREEPLAY MODE
# ==============================================================================
# Allows non-admin players to use safe commands (/rdebug start, stop, stats, etc.)
freeplay:
  enabled: false
