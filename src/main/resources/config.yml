# Rounds Plugin Configuration

# Language: "ru" or "en"
language: en

# Default player stats (reset each round)
defaults:
  # Base damage per bullet
  damage: 3.0
  # Base attack cooldown in ticks (20 ticks = 1 second). Lower = faster shooting
  attack-speed: 20
  # Additional attack speed modifier (added by cards, usually 0)
  attack-speed-modifier: 0
  # Extra attack range in blocks (added by cards, usually 0)
  attack-range: 0
  # Starting ammo (current bullets in magazine)
  ammo: 3
  # Maximum ammo capacity (reload restores to this value)
  max-ammo: 3
  # Number of bullets fired per shot (1 = single shot, >1 = shotgun)
  bullets: 1
  # Starting health (max 20 in vanilla, but can be higher)
  hp: 20
  # Bullet flight speed multiplier (1.0 = default)
  bullet-speed: 1.0
  # Reload speed bonus (0 = base 3 seconds, 0.95 = near-instant). Formula: 60 * (1.0 - reloadSpeed) ticks
  reload-speed: 0

game:
  default-rounds: 5
  max-rounds: 20
  card-selection-time: 200
  respawn-delay: 5

teams:
  enabled:
    - BLUE
    - RED
    - YELLOW
    - GREEN

gun:
  material: STICK
  base-cooldown: 20

resource-pack:
  auto-send: true
  port: 41071
  url: ""
  hash: ""
  prompt: "Download Rounds resource pack for custom textures?"

cards:
  selection-count: 5
  weighted-rarity: true

# ============================================
# SCOREBOARD
# ============================================
# ВАРИАНТ 1 (РЕКОМЕНДУЕМЫЙ): Плагин TAB
# Установите плагин TAB + PlaceholderAPI.
# Используйте плейсхолдеры в конфиге TAB:
#   %rounds_round%          - текущий раунд
#   %rounds_rounds_to_win%  - раундов до победы
#   %rounds_round_display%  - "3/5"
#   %rounds_state%          - состояние игры
#   %rounds_team%           - название команды игрока
#   %rounds_team_wins%      - победы команды игрока
#   %rounds_team_color%     - цвет команды (&a, &c и т.д.)
#   %rounds_blue_wins%      - победы синих
#   %rounds_red_wins%       - победы красных
#   %rounds_yellow_wins%    - победы жёлтых
#   %rounds_green_wins%     - победы зелёных
#
# ВАРИАНТ 2: Встроенный scoreboard (ниже)
# ⚠️  ВНИМАНИЕ: Встроенный SB конфликтует с TAB и другими
#     плагинами, которые управляют scoreboard'ом игроков!
#     Если у вас стоит TAB — НЕ включайте этот вариант!
#     Также встроенный SB не поддерживает цвета команд
#     в именах игроков и кастомные форматы.
builtin-scoreboard:
  enabled: false
  title: "&6&lROUNDS"
